<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add New File</title>

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/newfile.css') }}">

</head>

<body>

    <!-- Top-left navigation area -->
    <header class="page-header">

        <!-- Website logo and name -->
        <div class="logo">

            <img
                src="{{ url_for('static', filename='images/logo.png') }}"
                alt="Alpine Opps Logo"
            >

            <h2>Alpine Opps</h2>

        </div>

        <!-- Return to the dashboard -->
        <a
            href="{{ url_for('dashboard') }}"
            class="return-btn"
        >
            Return
        </a>

    </header>

    <!-- Centres the form on the page -->
    <main class="form-container">

        <section class="form-card">

            <h1>Add New File</h1>

            <p class="form-description">
                Enter the file information below.
            </p>

            <form action="{{ url_for('newfile') }}" method="POST">

                <div class="form-group">
                    <label for="file_name">File Name</label>

                    <input
                        type="text"
                        id="file_name"
                        name="file_name"
                        placeholder="Enter the file name"
                        required
                    >
                </div>
                       
                <!-- File Type -->
                <div class="form-group">
                    <label for="file_type">File Type</label>

                    <select 
                        id="filetype"
                        name="filetype"
                        placeholder="Select a file type"
                        required
                    >

                        <option value="PDF">PDF</option>

                        <option value="XLSX">Spreadsheet</option>

                        <option value="DOCX">Word Document</option>

                        <option value="PPTX">PowerPoint</option>

                        <option value="IMAGE">Image</option>

                        <option value="OTHER">Other</option>

                    </select>
                </div>
                
                <!-- URL or location of the file -->
                <div class="form-group">
                    <label for="file_url">File URL</label>

                    <input
                        type="url"
                        id="file_url"
                        name="file_url"
                        placeholder="https://..."
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="file_size">File Size</label>
                    
                    <input
                        type="text"
                        id="file_size"
                        name="file_size"
                        placeholder="Example: 20 KB"
                    >
                </div>


                <!-- Submit button -->
                <button type="submit" class="submit-btn">
                    Add File
                </button>

            </form>

        </section>

    </main>


</body>
</html>
