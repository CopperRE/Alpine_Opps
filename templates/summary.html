<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Summary</title>

</head>

<body>

    <h1>AI Summary</h1>

    <!-- Name of selected file -->
    <h2>
        {{ file["FileName"] }}
    </h2>


    <!-- AI generated summary -->
    <div class="summary">

        {{ summary }}

    </div>


    <!-- Return to dashboard -->
    <a href="{{ url_for('dashboard') }}">
        Return to Dashboard
    </a>

</body>

</html>
